name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov selenium webdriver-manager

      - name: Run Lint
        run: flake8 src/ || true

      - name: Start Flask App
        run: |
          python src/app.py &
          echo "Waiting for Flask to start..."
          for i in {1..15}; do
            if curl -s http://localhost:8080 >/dev/null; then
              echo "Flask started!"
              break
            fi
            sleep 1
          done

      - name: Run Unit + Integration + Selenium Tests with Coverage
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/unit tests/integration tests/selenium --cov=src --cov-report=xml --cov-report=term

      - name: Generate Coverage Badge
        run: |
          COVERAGE=$(python3 -c "import xml.etree.ElementTree as ET; tree=ET.parse('coverage.xml'); root=tree.getroot(); print(int(float(root.attrib.get('line-rate',0))*100))")
          cat > coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="120" height="20">
            <rect rx="3" width="120" height="20" fill="#555"/>
            <rect rx="3" x="60" width="60" height="20" fill="#4c1"/>
            <text x="30" y="14" fill="#fff" font-family="Verdana" font-size="11" text-anchor="middle">coverage</text>
            <text x="90" y="14" fill="#fff" font-family="Verdana" font-size="11" text-anchor="middle">${COVERAGE}%</text>
          </svg>
          EOF

      - name: Commit Coverage Badge
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add coverage.svg
          git commit -m "chore: update coverage badge" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }} HEAD:main

      - name: Build Docker Image
        run: docker build -t technical-debt-tracker .