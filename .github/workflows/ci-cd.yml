name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'

  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lint
        run: |
          flake8 src/ || true

      - name: Run Tests
        run: |
         export PYTHONPATH=$PYTHONPATH:.  
         pytest --maxfail=1 --disable-warnings -q

      - name: Build Docker Image
        run: |
          docker build -t technical-debt-tracker .